<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espaces — Client Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 4px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 8px;
    }

    input[type="password"] {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
      background: #fafafa;
    }

    input[type="password"]:focus {
      border-color: #1a1a1a;
      background: #fff;
    }

    input[type="password"].error {
      border-color: #c0392b;
    }

    button[type="submit"] {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #333; }

    .error-msg {
      font-size: 13px;
      color: #c0392b;
      margin-top: 10px;
    }

    /* Portal */
    .portal-header {
      margin-bottom: 32px;
    }

    .portal-header h1 { margin-bottom: 4px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .file-list {
      list-style: none;
    }

    .file-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .file-list li:last-child { border-bottom: none; }

    .file-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s;
    }

    .file-list a:hover { color: #555; }

    .file-list a .icon {
      width: 32px;
      height: 32px;
      background: #f5f4f0;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .file-list a .meta {
      font-size: 12px;
      color: #999;
      font-weight: 400;
      margin-top: 2px;
    }

    .file-list a .file-info { flex: 1; }

    .file-list a .arrow {
      color: #ccc;
      font-size: 16px;
    }

    .logout {
      margin-top: 24px;
      font-size: 12px;
      color: #bbb;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .logout:hover { color: #888; }
  </style>
</head>
<body>

<div class="card">
  <div class="wordmark">Espaces</div>

  <!-- Gate -->
  <div id="gate">
    <h1>Client Portal</h1>
    <p class="sub">Enter your access password to view shared files.</p>
    <form id="gate-form" novalidate>
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="" autocomplete="current-password">
      <p class="error-msg" id="error-msg" hidden>Incorrect password. Please try again.</p>
      <button type="submit">Access Files</button>
    </form>
  </div>

  <!-- Portal -->
  <div id="portal" hidden>
    <div class="portal-header">
      <div class="wordmark">Espaces</div>
      <h1>Shared Files</h1>
    </div>

    <div class="section-label">Murfreesboro</div>
    <ul class="file-list">
      <li>
        <a href="murfreesboro/murfreesboro-private-offices.html" target="_blank">
          <div class="icon">📄</div>
          <div class="file-info">
            Private Offices
            <div class="meta">Landing page</div>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>

    <button class="logout" onclick="logout()">Sign out</button>
  </div>
</div>

<script>
  var AUTH_KEY = 'esp_auth';
  var PASSWORD = 'espaces2012';

  function showPortal() {
    document.getElementById('gate').hidden = true;
    document.getElementById('portal').hidden = false;
  }

  function logout() {
    sessionStorage.removeItem(AUTH_KEY);
    document.getElementById('gate').hidden = false;
    document.getElementById('portal').hidden = true;
    document.getElementById('pw').value = '';
  }

  if (sessionStorage.getItem(AUTH_KEY) === '1') {
    showPortal();
  }

  document.getElementById('gate-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var errMsg = document.getElementById('error-msg');
    var input = document.getElementById('pw');

    if (pw === PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, '1');
      errMsg.hidden = true;
      input.classList.remove('error');
      showPortal();
    } else {
      errMsg.hidden = false;
      input.classList.add('error');
      input.value = '';
      input.focus();
    }
  });
</script>

</body>
</html>
